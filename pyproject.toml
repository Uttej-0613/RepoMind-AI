[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repomind-ai"
version = "1.0.0"
description = "Local-first codebase intelligence with source citations"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[project.scripts]
repomind = "repomind.cli:main"

[tool.setuptools.packages.find]
include = ["repomind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
