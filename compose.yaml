services:
  repomind:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REPOMIND_ROOT: /workspace
      REPOMIND_DATA_DIR: /data
      REPOMIND_API_KEY: ${REPOMIND_API_KEY:-}
      REPOMIND_LLM_API_KEY: ${REPOMIND_LLM_API_KEY:-}
      REPOMIND_LLM_URL: ${REPOMIND_LLM_URL:-https://api.openai.com/v1/chat/completions}
      REPOMIND_LLM_MODEL: ${REPOMIND_LLM_MODEL:-gpt-4o-mini}
    volumes:
      - "${REPO_PATH:-.}:/workspace:ro"
      - repomind_data:/data
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  repomind_data:
