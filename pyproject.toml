[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repomind-ai"
version = "2.0.0"
description = "Local-first code intelligence: cited retrieval, grounded LLM chat, and repository explorer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bhasuru Uttej" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[project.scripts]
repomind = "repomind.cli:main"

[tool.setuptools.packages.find]
include = ["repomind*"]

[tool.setuptools.package-data]
repomind = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
